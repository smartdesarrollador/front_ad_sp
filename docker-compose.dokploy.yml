# docker-compose.dokploy.yml — para Dokploy (Traefik gestionado por Dokploy UI)

services:
  admin:
    build:
      context: .
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME:-RBAC Admin Panel}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
